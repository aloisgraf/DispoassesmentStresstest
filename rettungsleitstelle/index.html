<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RK Salzburg – Leitstellen Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-screen" class="login-screen">
    <div class="login-box">
      <div class="login-logo">
        <div class="login-cross">✚</div>
        <div class="login-title">Rotes Kreuz Salzburg</div>
        <div class="login-subtitle">Leitstellen Simulator</div>
      </div>
      <div class="login-form">
        <div class="login-role-select">
          <button class="role-btn active" data-role="disponent">Disponenten-Login</button>
          <button class="role-btn" data-role="pruefer">Prüfer-Login</button>
        </div>
        <input type="text" id="login-name" placeholder="Name / Kürzel" />
        <input type="password" id="login-pin" placeholder="PIN" />
        <button id="login-btn" class="login-submit">Anmelden</button>
        <div id="login-error" class="login-error" style="display:none">Ungültige Zugangsdaten</div>
      </div>
    </div>
  </div>

  <div id="app" class="app" style="display:none">
    <div class="menubar">
      <div class="menubar-left">
        <div class="menubar-logo">✚ RK Salzburg – Leitstelle</div>
        <div class="menubar-tabs">
          <button class="menu-tab active" data-window="both">Beide Fenster</button>
          <button class="menu-tab" data-window="status">Statusschirm</button>
          <button class="menu-tab" data-window="einsatz">Einsatzmaske</button>
        </div>
      </div>
      <div class="menubar-right">
        <div class="menubar-time" id="clock">--:--:--</div>
        <div class="menubar-user" id="current-user">–</div>
        <div class="menubar-status-ind" id="sim-status-ind">
          <span class="status-dot idle"></span><span id="sim-status-text">Bereit</span>
        </div>
        <button id="btn-popout-status" class="menu-icon-btn">⧉</button>
        <button id="btn-logout" class="menu-icon-btn">⏻</button>
      </div>
    </div>

    <div class="main-layout" id="main-layout">
      <div class="panel panel-einsatz" id="panel-einsatz">
        <div class="einsatzmaske-header">
          <div class="panel-header">
            <span class="panel-title">Einsatzmaske</span>
            <div class="panel-header-right">
              <span id="em-rnkr">–</span>
              <button class="btn-small btn-new-einsatz" id="btn-new-einsatz">+ Neuer</button>
            </div>
          </div>
        </div>

        <div class="einsatzmaske-scroll">
          <div class="em-section">
            <div class="em-2col">
              <div class="em-col">
                <div class="em-field"><label>Einsatzadresse</label><input type="text" id="f-adresse" placeholder="Straße, Hausnummer, Ort" /></div>
                <div class="em-field"><label>Etage / Objekt</label><input type="text" id="f-etage" placeholder="z.B. 2. OG, Büro" /></div>
              </div>
              <div class="em-col">
                <div class="em-field"><label>Einsatzgrund</label><input type="text" id="f-stichwort" placeholder="z.B. INT – Kardial" /></div>
                <div class="em-field"><label>Priorität</label>
                  <select id="f-prioritaet">
                    <option value="E1">E1 – Notfall</option>
                    <option value="E2">E2 – Dringend</option>
                    <option value="E3">E3 – Normal</option>
                    <option value="KT">KT – Transport</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <div class="aao-section">
            <div class="aao-header">AAO – Alarm- & Ausrückeordnung</div>
            <div class="aao-chips" id="aao-chips"></div>
            <div class="aao-controls">
              <select id="aao-select-em">
                <option value="">– Einsatzmittel –</option>
                <optgroup label="Eigene">
                  <option value="20-201">20-201 RTW</option><option value="20-202">20-202 RTW</option>
                  <option value="20-203">20-203 RTW</option><option value="20-204">20-204 RTW</option>
                  <option value="20-205">20-205 RTW</option><option value="20-206">20-206 RTW</option>
                  <option value="20-207">20-207 RTW</option><option value="20-301">20-301 KTW</option>
                  <option value="20-302">20-302 KTW</option><option value="20-303">20-303 KTW</option>
                  <option value="20-304">20-304 KTW</option><option value="20-305">20-305 KTW</option>
                  <option value="20-306">20-306 KTW</option><option value="20-307">20-307 KTW</option>
                  <option value="20-308">20-308 KTW</option><option value="10-101">10-101 NEF</option>
                  <option value="C6">C6 Christophorus</option><option value="20-701">20-701 Einsatzleiter</option>
                  <option value="FR-Koppl">FR Koppl</option><option value="FR-Gnigl">FR Gnigl</option>
                  <option value="FR-Maxglan">FR Maxglan</option><option value="FR-Liefering">FR Liefering</option>
                  <option value="FR-Bergheim">FR Bergheim</option><option value="FR-Taxham">FR Taxham</option>
                </optgroup>
                <optgroup label="Partner">
                  <option value="BRG-Grödig">Bergrettung Grödig</option><option value="BRG-Gaisberg">Bergrettung Gaisberg</option>
                  <option value="BRG-Saalbach">Bergrettung Saalbach</option><option value="WR-Wolfgangsee">Wasserrettung Wolfgangsee</option>
                  <option value="WR-Mondsee">Wasserrettung Mondsee</option><option value="KIT">KIT</option>
                </optgroup>
              </select>
              <button class="btn-small" id="btn-aao-add">+</button>
              <button class="btn-small" id="btn-aao-vorschlag">Vorschlag</button>
            </div>
            <div class="aao-hint" id="aao-hint"></div>
          </div>

          <div class="em-section">
            <div class="em-2col">
              <div class="em-col">
                <div class="em-field"><label>Patientenname</label><input type="text" id="f-patient" placeholder="Name oder Unbekannt" /></div>
                <div class="em-field"><label>Alter</label><input type="number" id="f-alter" placeholder="Jahre" min="0" max="120" /></div>
                <div class="em-field"><label>Geschlecht</label>
                  <select id="f-geschlecht">
                    <option value="-">–</option><option value="m">Männlich</option>
                    <option value="w">Weiblich</option><option value="d">Divers</option>
                  </select>
                </div>
                <div class="em-field"><label>Bewusstsein</label>
                  <select id="f-bewusstsein">
                    <option value="-">–</option><option value="wach">Wach</option>
                    <option value="eingeschränkt">Eingeschränkt</option><option value="bewusstlos">Bewusstlos</option>
                    <option value="reanimation">Reanimation</option>
                  </select>
                </div>
              </div>
              <div class="em-col">
                <div class="em-field"><label>Zielort</label><input type="text" id="f-zielort" placeholder="z.B. UKH, LKH, CDK" /></div>
                <div class="em-field"><label>Station / Bereich</label><input type="text" id="f-ziel-station" placeholder="z.B. Kath-Labor" /></div>
                <div class="em-field"><label>Einsatzart</label>
                  <select id="f-einsatzart">
                    <option value="RD">Rettungsdienst</option><option value="KT">Krankentransport</option>
                    <option value="BRG">Bergeinsatz</option><option value="WS">Wassereinsatz</option>
                    <option value="SL">Sonderlage</option>
                  </select>
                </div>
                <div class="em-field"><label>Status</label>
                  <select id="f-einsatz-status">
                    <option value="offen">Offen</option><option value="laufend">Laufend</option>
                    <option value="abgeschlossen">Abgeschlossen</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <div class="em-buttons-row">
            <button class="btn-action btn-alarm" id="btn-alarmieren">🚨 ALARMIEREN</button>
            <button class="btn-action btn-save" id="btn-einsatz-save">💾 Speichern</button>
            <button class="btn-action" id="btn-einsatz-abschliessen">✓ Abschließen</button>
          </div>
        </div>

        <div class="einsatzliste-panel">
          <div class="panel-header"><span class="panel-title">Einsatzliste</span></div>
          <div class="einsatzliste-table-wrap">
            <table class="einsatzliste-table" id="einsatzliste-table">
              <thead><tr><th>Zeit</th><th>RNKR</th><th>Stichwort</th><th>Status</th><th>Ort</th><th>Mittel</th><th>Prio</th></tr></thead>
              <tbody id="einsatzliste-tbody"><tr class="einsatz-empty-row"><td colspan="7">–</td></tr></tbody>
            </table>
          </div>
        </div>

        <div class="funk-panel">
          <div class="panel-header"><span class="panel-title">🎙 Funk</span></div>
          <div class="funk-messages" id="funk-messages"></div>
          <div class="funk-input-row">
            <input type="text" id="funk-input" placeholder="Antwort..." disabled />
            <button class="btn-funk-send" id="btn-funk-send" disabled>▶</button>
          </div>
        </div>
      </div>

      <div class="panel panel-status" id="panel-status">
        <div class="panel-header"><span class="panel-title">Statusschirm – Einsatzmittel</span></div>
        <div class="status-screen" id="status-screen"></div>
      </div>
    </div>
  </div>

  <div class="pruefer-overlay" id="pruefer-overlay" style="display:none">
    <div class="pruefer-panel">
      <div class="pruefer-header"><span>🔐 Prüfer</span><button id="btn-pruefer-close">✕</button></div>
      <div class="pruefer-body">
        <div class="pruefer-section">
          <h3>Übung</h3>
          <button class="btn-pruefer-action" id="btn-uebung-start">▶ Start</button>
          <button class="btn-pruefer-action btn-stop" id="btn-uebung-stop" disabled>⏹ Stop</button>
          <button class="btn-pruefer-action" id="btn-uebung-auswertung">📊 Auswertung</button>
        </div>
        <div class="pruefer-section">
          <h3>Szenario</h3>
          <div id="pruefer-szenario-info">–</div>
        </div>
        <div class="pruefer-section">
          <h3>Katalog</h3>
          <select id="pruefer-filter-kat">
            <option value="">Alle</option>
            <option value="Interne Notfälle">Interne Notfälle</option>
            <option value="Krankentransport">Krankentransport</option>
            <option value="Verkehrsunfall">Verkehrsunfall</option>
            <option value="Bergeinsatz">Bergeinsatz</option>
            <option value="Wassereinsatz">Wassereinsatz</option>
            <option value="Sonderlage">Sonderlage</option>
          </select>
          <div class="pruefer-szenario-liste" id="pruefer-szenario-liste"></div>
        </div>
        <div class="pruefer-section">
          <h3>Log</h3>
          <div class="pruefer-log" id="pruefer-log"></div>
        </div>
      </div>
    </div>
  </div>

  <button class="pruefer-toggle-btn" id="pruefer-toggle-btn" style="display:none">🔐</button>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="extensions.js"></script>
</body>
</html>
